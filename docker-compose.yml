services:
  db:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-peimaneh}"
      POSTGRES_USER: "${POSTGRES_USER:-peimaneh}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: "5s"
      timeout: "5s"
      retries: 10
    restart: "unless-stopped"

  backend:
    build:
      context: "./backend"
      dockerfile: "Dockerfile"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://peimaneh:change-me@db:5432/peimaneh}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080}"
      ALLOW_BOOTSTRAP_REGISTRATION: "${ALLOW_BOOTSTRAP_REGISTRATION:-false}"
    depends_on:
      db:
        condition: "service_healthy"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: "10s"
      timeout: "3s"
      retries: 5
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    restart: "unless-stopped"
    init: true

  backend-tests:
    build:
      context: "./backend"
      dockerfile: "Dockerfile.test"
    environment:
      DATABASE_URL: "sqlite:///./test.db"
    profiles: ["test"]

  frontend-tests:
    build:
      context: "./frontend"
      dockerfile: "Dockerfile.test"
    profiles: ["test"]

  frontend:
    build:
      context: "./frontend"
      dockerfile: "Dockerfile"
    depends_on:
      backend:
        condition: "service_healthy"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    restart: "unless-stopped"

volumes:
  postgres_data:
