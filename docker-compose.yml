services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peimaneh
      POSTGRES_USER: peimaneh
      POSTGRES_PASSWORD: peimaneh_local_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peimaneh -d peimaneh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://peimaneh:peimaneh_local_dev@db:5432/peimaneh
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
